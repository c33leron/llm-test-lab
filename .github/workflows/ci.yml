name: lab-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install exactly as a new user (network allowed at setup)
        run: ./lab setup
      - name: Static and contract checks
        run: |
          .venv/bin/python scripts/check_publication.py
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy src/llm_test_lab
          .venv/bin/pytest
          .venv/bin/python -m llm_test_lab.contracts.schemas --check
          .venv/bin/python scripts/check_docs.py
          git diff --exit-code -- uv.lock tooling/promptfoo/package-lock.json schemas
      - name: Smoke and complete fixture matrix with OS network denied
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sandbox-exec -p '(version 1)(allow default)(deny network*)' "$PWD/.venv/bin/lab" smoke
            sandbox-exec -p '(version 1)(allow default)(deny network*)' "$PWD/.venv/bin/lab" run --source fixture --suite core --variants all --gate fixture-contract
          else
            # Root creates the network namespace, not the private evidence files.
            sudo unshare --net --setuid="$(id -u)" --setgid="$(id -g)" -- env PATH="$PATH" "$PWD/.venv/bin/lab" smoke
            sudo unshare --net --setuid="$(id -u)" --setgid="$(id -g)" -- env PATH="$PATH" "$PWD/.venv/bin/lab" run --source fixture --suite core --variants all --gate fixture-contract
          fi
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          evidence = [path for path in Path("runs").rglob("*") if path.is_file()]
          assert evidence, "No synthetic evidence was produced"
          for path in evidence:
              assert path.stat().st_uid == os.getuid(), f"Unexpected evidence owner: {path}"
              with path.open("rb") as source:
                  source.read(1)
          print(f"Evidence owner/readability: {len(evidence)} files OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-lab-evidence-${{ matrix.os }}
          path: runs/
          retention-days: 7
